name: Setup Parte 1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrivi i file base dell'app
        run: |
          mkdir -p src scripts public
          cat > package.json << 'APPFILE_EOF'
          {
            "name": "analogista-v2",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "main": "dist-electron/main.cjs",
            "scripts": {
              "dev": "vite",
              "build": "vite build",
              "preview": "vite preview"
            },
            "dependencies": {
              "@mediapipe/tasks-vision": "^0.10.35",
              "react": "^19.2.0",
              "react-dom": "^19.2.0"
            },
            "devDependencies": {
              "@tailwindcss/vite": "^4.3.0",
              "@types/react": "^19.2.0",
              "@types/react-dom": "^19.2.0",
              "@vitejs/plugin-react": "^5.0.0",
              "tailwindcss": "^4.3.0",
              "typescript": "~5.8.2",
              "vite": "^6.2.0"
            }
          }
          APPFILE_EOF
          cat > vite.config.ts << 'APPFILE_EOF'
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          import tailwindcss from '@tailwindcss/vite';
          export default defineConfig({
            plugins: [react(), tailwindcss()],
            build: { outDir: 'dist', emptyOutDir: true },
            publicDir: 'public'
          });
          APPFILE_EOF
          cat > index.html << 'APPFILE_EOF'
          <!doctype html>
          <html lang="it">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Analogista Virtuale di Max Pisani</title>
              <link rel="preconnect" href="https://fonts.googleapis.com" />
              <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
              <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Merriweather:wght@700&display=swap" rel="stylesheet" />
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>
          APPFILE_EOF
          cat > src/index.css << 'APPFILE_EOF'
          @import "tailwindcss";
          @theme {
            --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
            --font-serif: "Merriweather", ui-serif, Georgia, serif;
          }
          body { @apply bg-[#0a0a0c] text-white antialiased overflow-x-hidden; }
          APPFILE_EOF
          cat > src/main.tsx << 'APPFILE_EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import App from './App';
          import './index.css';
          createRoot(document.getElementById('root')!).render(
            <React.StrictMode>
              <App />
            </React.StrictMode>
          );
          APPFILE_EOF
          cat > scripts/prepare-offline-assets.mjs << 'APPFILE_EOF'
          import fs from 'fs';
          import path from 'path';
          import { fileURLToPath } from 'url';
          const root = path.join(path.dirname(fileURLToPath(import.meta.url)), '..');
          const dest = path.join(root, 'public', 'mediapipe');
          fs.mkdirSync(path.join(dest, 'wasm'), { recursive: true });
          fs.cpSync(path.join(root, 'node_modules', '@mediapipe', 'tasks-vision', 'wasm'), path.join(dest, 'wasm'), { recursive: true });
          const model = await fetch('https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task').then(r => r.arrayBuffer());
          fs.writeFileSync(path.join(dest, 'pose_landmarker_lite.task'), Buffer.from(model));
          console.log('Asset MediaPipe offline pronti.');
          APPFILE_EOF
          cat > src/motion.ts << 'APPFILE_EOF'
          import { PoseLandmarker, FilesetResolver } from "@mediapipe/tasks-vision";
          const CDN_WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm";
          const CDN_MODEL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
          const LOCAL_WASM = "mediapipe/wasm";
          const LOCAL_MODEL = "mediapipe/pose_landmarker_lite.task";
          export type Direction = 'forward' | 'backward';
          export class Motion {
            private video: HTMLVideoElement | null = null;
            private landmarker: PoseLandmarker | null = null;
            private raf = 0;
            private running = false;
            private smoothed: number | null = null;
            private neutral = 0;
            private sensitivity = 0.015;
            private last: Direction | 'none' = 'none';
            private lastEmit = 0;
            onMove: ((d: Direction) => void) | null = null;
            async init(video: HTMLVideoElement) {
              this.video = video;
              const packaged = !!(window as any).Capacitor || navigator.userAgent.toLowerCase().includes('electron');
              const wasm = packaged ? LOCAL_WASM : CDN_WASM;
              const model = packaged ? LOCAL_MODEL : CDN_MODEL;
              const vision = await FilesetResolver.forVisionTasks(wasm);
              this.landmarker = await PoseLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: model, delegate: "GPU" },
                runningMode: "VIDEO", numPoses: 1
              });
            }
            setSensitivity(percent: number) { this.sensitivity = 0.05 - (percent / 100) * 0.045; }
            calibrate() { if (this.smoothed !== null) this.neutral = this.smoothed; }
            start() { if (this.running || !this.landmarker) return; this.running = true; this.last = 'none'; this.smoothed = null; this.loop(); }
            stop() { this.running = false; cancelAnimationFrame(this.raf); }
            private depth(lm: any[]): number {
              const nose = lm[0], ls = lm[11], rs = lm[12];
              if (!nose || !ls || !rs) return 0;
              const midX = (ls.x + rs.x) / 2, midY = (ls.y + rs.y) / 2;
              const sw = Math.hypot(ls.x - rs.x, ls.y - rs.y);
              const nd = Math.hypot(nose.x - midX, nose.y - midY);
              return sw * 0.7 + nd * 0.3;
            }
            private loop = () => {
              if (!this.running || !this.video || !this.landmarker) return;
              try {
                const res = this.landmarker.detectForVideo(this.video, performance.now());
                const lm = res.landmarks?.[0];
                if (lm) {
                  const raw = this.depth(lm);
                  this.smoothed = this.smoothed === null ? raw : this.smoothed * 0.8 + raw * 0.2;
                  const off = this.smoothed - this.neutral;
                  const cur: Direction | 'none' =
                    off > this.sensitivity ? 'forward' :
                    off < -this.sensitivity ? 'backward' :
                    Math.abs(off) < this.sensitivity * 0.4 ? 'none' : this.last;
                  const now = Date.now();
                  if (cur !== 'none' && cur !== this.last && now - this.lastEmit > 600) {
                    this.lastEmit = now;
                    this.onMove?.(cur);
                  }
                  this.last = cur;
                }
              } catch (e) { }
              this.raf = requestAnimationFrame(this.loop);
            };
          }
          APPFILE_EOF
          cat > src/voice.ts << 'APPFILE_EOF'
          import type { Motion, Direction } from './motion';
          export type VoiceInfo = { kind: 'info' | 'error'; text: string };
          export class Voice {
            onStatus: ((i: VoiceInfo) => void) | null = null;
            private synth = window.speechSynthesis;
            private epoch = 0;
            constructor() {
              try { this.synth.getVoices(); this.synth.onvoiceschanged = () => this.synth.getVoices(); } catch (e) { }
            }
            cancel() { this.epoch++; try { this.synth.cancel(); } catch (e) { } }
            private info(kind: 'info' | 'error', text: string) { this.onStatus?.({ kind, text }); }
            private async nativeSpeak(text: string, my: number): Promise<boolean> {
              if (!(window as any).Capacitor) return false;
              try {
                const mod: any = await import('@capacitor-community/text-to-speech');
                if (my !== this.epoch) return false;
                await Promise.race([
                  mod.TextToSpeech.speak({ text, lang: 'it-IT', rate: 0.95, pitch: 1, volume: 1 }),
                  new Promise((_, rj) => setTimeout(() => rj(new Error('motore nativo non risponde (4s)')), 4000))
                ]);
                return true;
              } catch (e: any) {
                try { const m: any = await import('@capacitor-community/text-to-speech'); m.TextToSpeech.stop?.(); } catch (e2) { }
                if (my === this.epoch) this.info('error', 'Voce nativa KO: ' + String(e?.message || e));
                return false;
              }
            }
            speak(text: string): Promise<void> {
              const my = this.epoch;
              return new Promise((resolve) => {
                const execute = async () => {
                  if (my !== this.epoch) return resolve();
                  this.info('info', 'Voce in corso…');
                  if (await this.nativeSpeak(text, my)) {
                    if (my === this.epoch) this.info('info', '');
                    return resolve();
                  }
                  if (my !== this.epoch) return resolve();
                  setTimeout(() => {
                    if (my !== this.epoch) return resolve();
                    let settled = false;
                    let spoke = false;
                    let safety: number | undefined, kick: number | undefined, retry: number | undefined;
                    const done = () => {
                      if (settled) return;
                      settled = true;
                      if (safety) clearTimeout(safety);
                      if (kick) clearTimeout(kick);
                      if (retry) clearTimeout(retry);
                      if (!spoke && my === this.epoch) this.info('error', 'Sintesi di sistema muta: controlla volume multimediale e impostazioni TTS del dispositivo.');
                      else if (my === this.epoch) this.info('info', '');
                      resolve();
                    };
                    safety = window.setTimeout(done, Math.max(20000, text.length * 150));
                    kick = window.setTimeout(() => { try { this.synth.resume(); } catch (e) { } }, 250);
                    const build = () => {
                      if (my !== this.epoch) return;
                      try { this.synth.cancel(); this.synth.resume(); } catch (e) { }
                      const u = new SpeechSynthesisUtterance(text);
                      u.lang = 'it-IT';
                      u.rate = 0.95;
                      u.volume = 1;
                      const voices = this.synth.getVoices();
                      const v = voices.find(x => x.name.includes('Google italiano')) || voices.find(x => x.lang.startsWith('it'));
                      if (v) u.voice = v;
                      u.onstart = () => { spoke = true; };
                      u.onend = done;
                      u.onerror = done;
                      this.synth.speak(u);
                    };
                    build();
                    retry = window.setTimeout(() => { if (!settled && !this.synth.speaking) build(); }, 1200);
                  }, 100);
                };
                execute();
              });
            }
            async ask(question: string, motion: Motion): Promise<'SI' | 'NO' | 'NONE'> {
              const my = this.epoch;
              await this.speak(question);
              if (my !== this.epoch) return 'NONE';
              this.info('info', 'Attendo risposta: oscilla avanti (SI) o indietro (NO).');
              return new Promise((resolve) => {
                let finished = false;
                const finish = (r: 'SI' | 'NO' | 'NONE') => {
                  if (finished) return;
                  finished = true;
                  motion.onMove = null;
                  if (to) clearTimeout(to);
                  resolve(r);
                };
                const to = window.setTimeout(async () => {
                  motion.stop();
                  await this.speak('Non ho rilevato nessun movimento.');
                  finish('NONE');
                }, 12000);
                motion.onMove = async (d: Direction) => {
                  motion.stop();
                  const r = d === 'forward' ? 'SI' : 'NO';
                  await this.speak(r === 'SI' ? 'Ho rilevato un SI.' : 'Ho rilevato un NO.');
                  finish(r);
                };
                motion.start();
              });
            }
          }
          APPFILE_EOF

      - name: Commit automatico dei sorgenti
        run: |
          git config user.name "factory-bot"
          git config user.email "factory-bot@users.noreply.github.com"
          git add -A
          git commit -m "Factory v2: parte 1 sorgenti"
          git push origin HEAD:main
